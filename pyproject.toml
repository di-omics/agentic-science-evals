[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-science-evals"
version = "0.1.0"
description = "Agent eval tasks built from published papers: one real analysis decision per task, on the paper's public data, each shipped with the scripted controls its grader was tested against."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
analysis = [
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "anndata>=0.10",
  "scanpy>=1.10",
  "leidenalg>=0.10",
  "openpyxl>=3.1",
  "pydeseq2>=0.4",
  "rdata>=1.1",
]
grade = ["latch-eval-tools==0.4.54"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/science_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
